<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Browser Add-ons store showing LeechBlock NG installation page with Add to Browser button">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Browser top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <circle cx="45" cy="41" r="6" fill="#ef4444"/>
  <circle cx="65" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="41" r="6" fill="#10b981"/>
  <rect x="110" y="30" width="340" height="22" fill="#ffffff" rx="4"/>
  <text x="120" y="46" font-family="sans-serif" font-size="12" fill="#64748b">addons.mozilla.org / LeechBlock NG</text>
  <!-- Extension details -->
  <rect x="50" y="90" width="64" height="64" fill="#0f766e" rx="8"/>
  <text x="68" y="132" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">LB</text>
  <text x="130" y="112" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f172a">LeechBlock NG</text>
  <text x="130" y="134" font-family="sans-serif" font-size="14" fill="#475569">by James Anderson (Open Source MPL-2.0)</text>
  <!-- Install button -->
  <rect x="440" y="100" width="150" height="40" fill="#0f766e" rx="6"/>
  <text x="465" y="125" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">+ Add to Browser</text>
  <!-- Features summary box -->
  <rect x="50" y="180" width="540" height="130" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
  <text x="70" y="210" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 1: Install &amp; Pin to Toolbar</text>
  <text x="70" y="235" font-family="sans-serif" font-size="13" fill="#334155">• Click '+ Add to Browser' on Firefox, Chrome Web Store, or Edge Add-ons.</text>
  <text x="70" y="260" font-family="sans-serif" font-size="13" fill="#334155">• When prompted for permissions, click 'Add' (requires tab access to block domains).</text>
  <text x="70" y="285" font-family="sans-serif" font-size="13" fill="#334155">• Click the browser puzzle piece icon and pin LeechBlock NG to your toolbar.</text>
</svg>
