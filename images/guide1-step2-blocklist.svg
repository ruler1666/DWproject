<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="LeechBlock NG options screen showing Block Set 1 configuration with domain names entered">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <rect x="20" y="20" width="600" height="40" fill="#0f766e" rx="6"/>
  <text x="40" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">LeechBlock Options > Block Set 1: Distraction Domains</text>
  <!-- Textarea area -->
  <text x="50" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Enter the sites to block (one domain per line):</text>
  <rect x="50" y="105" width="540" height="120" fill="#f1f5f9" stroke="#94a3b8" rx="4"/>
  <text x="65" y="130" font-family="monospace" font-size="14" fill="#0f172a">youtube.com</text>
  <text x="65" y="152" font-family="monospace" font-size="14" fill="#0f172a">reddit.com</text>
  <text x="65" y="174" font-family="monospace" font-size="14" fill="#0f172a">twitter.com, x.com</text>
  <text x="65" y="196" font-family="monospace" font-size="14" fill="#0f172a">instagram.com</text>
  <text x="65" y="215" font-family="monospace" font-size="13" fill="#64748b">netflix.com, twitch.tv</text>
  <!-- Note -->
  <rect x="50" y="245" width="540" height="70" fill="#ecfdf5" stroke="#a7f3d0" rx="4"/>
  <text x="65" y="270" font-family="sans-serif" font-size="13" font-weight="bold" fill="#065f46">Tip for Student Workflows:</text>
  <text x="65" y="292" font-family="sans-serif" font-size="13" fill="#065f46">If you need educational videos, prefix with '+' to allow specific channels or playlists.</text>
</svg>
