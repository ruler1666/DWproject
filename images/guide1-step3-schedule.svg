<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="LeechBlock NG scheduling settings with time periods 0900-1300 and 1400-1800 on Monday through Friday">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <rect x="20" y="20" width="600" height="40" fill="#0f766e" rx="6"/>
  <text x="40" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">LeechBlock Options > When to Block</text>
  <text x="50" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Select Blocking Schedule:</text>
  <rect x="50" y="105" width="260" height="36" fill="#f1f5f9" stroke="#94a3b8" rx="4"/>
  <text x="65" y="128" font-family="monospace" font-size="14" fill="#0f172a">0900-1300, 1400-1730</text>
  <text x="325" y="128" font-family="sans-serif" font-size="13" fill="#64748b">(24-hour military format, comma separated)</text>
  <text x="50" y="175" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Days of the Week Active:</text>
  <!-- Day checkboxes -->
  <g transform="translate(50, 190)">
    <rect x="0" y="0" width="65" height="30" fill="#0f766e" rx="4"/>
    <text x="18" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">Mon ✓</text>
    <rect x="75" y="0" width="65" height="30" fill="#0f766e" rx="4"/>
    <text x="93" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">Tue ✓</text>
    <rect x="150" y="0" width="65" height="30" fill="#0f766e" rx="4"/>
    <text x="168" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">Wed ✓</text>
    <rect x="225" y="0" width="65" height="30" fill="#0f766e" rx="4"/>
    <text x="243" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">Thu ✓</text>
    <rect x="300" y="0" width="65" height="30" fill="#0f766e" rx="4"/>
    <text x="318" y="20" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fff">Fri ✓</text>
    <rect x="375" y="0" width="65" height="30" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="393" y="20" font-family="sans-serif" font-size="12" fill="#64748b">Sat</text>
    <rect x="450" y="0" width="65" height="30" fill="#f1f5f9" stroke="#cbd5e1" rx="4"/>
    <text x="468" y="20" font-family="sans-serif" font-size="12" fill="#64748b">Sun</text>
  </g>
  <rect x="50" y="245" width="540" height="70" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
  <text x="65" y="272" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Automatic Activation Rule:</text>
  <text x="65" y="295" font-family="sans-serif" font-size="13" fill="#334155">Study hours automatically turn on without requiring manual daily clicks or willpower.</text>
</svg>
