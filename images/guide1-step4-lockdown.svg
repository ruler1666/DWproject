<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="LeechBlock NG access control dialog showing 60-character random password requirement to prevent impulse unlocking">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <rect x="20" y="20" width="600" height="40" fill="#b91c1c" rx="6"/>
  <text x="40" y="46" font-family="sans-serif" font-size="16" font-weight="bold" fill="#ffffff">LeechBlock Options > Access Control (Impulse Protection)</text>
  <text x="50" y="90" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Prevent Access to Options Page During Block Periods:</text>
  <!-- Radio selection -->
  <g transform="translate(50, 105)">
    <circle cx="10" cy="12" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="30" y="16" font-family="sans-serif" font-size="13" fill="#64748b">Require fixed password (easy to memorize and bypass)</text>
    
    <circle cx="10" cy="46" r="8" fill="#0f766e" stroke="#0f766e" stroke-width="2"/>
    <circle cx="10" cy="46" r="4" fill="#ffffff"/>
    <text x="30" y="50" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Require random 64-character text code to unlock</text>
    
    <circle cx="10" cy="80" r="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <text x="30" y="84" font-family="sans-serif" font-size="13" fill="#64748b">Block access to Options completely until block period ends</text>
  </g>
  <rect x="50" y="225" width="540" height="90" fill="#fef2f2" stroke="#fecaca" rx="4"/>
  <text x="65" y="252" font-family="sans-serif" font-size="13" font-weight="bold" fill="#991b1b">Why the 64-character friction works:</text>
  <text x="65" y="275" font-family="sans-serif" font-size="13" fill="#7f1d1d">Typing 64 random alphanumeric characters forces your prefrontal cortex to wake up,</text>
  <text x="65" y="295" font-family="sans-serif" font-size="13" fill="#7f1d1d">shattering mindless habit loops before you can cancel the block.</text>
</svg>
