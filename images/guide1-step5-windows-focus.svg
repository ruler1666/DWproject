<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Windows 11 Focus Session dialog in Clock app set to 45 minutes with Do Not Disturb badge active">
  <rect width="640" height="360" fill="#0f172a" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#1e293b" stroke="#334155" stroke-width="2" rx="6"/>
  <!-- Clock App header -->
  <text x="50" y="60" font-family="sans-serif" font-size="20" font-weight="bold" fill="#f8fafc">Clock > Focus Sessions</text>
  <rect x="50" y="85" width="220" height="220" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="75" y="125" font-family="sans-serif" font-size="14" fill="#94a3b8">Ready, set, focus</text>
  <!-- Timer dial representation -->
  <circle cx="160" cy="190" r="50" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="160" cy="190" r="50" fill="none" stroke="#38bdf8" stroke-width="8" stroke-dasharray="314" stroke-dashoffset="100"/>
  <text x="135" y="198" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">45</text>
  <text x="165" y="198" font-family="sans-serif" font-size="13" fill="#94a3b8">mins</text>
  <rect x="80" y="255" width="160" height="36" fill="#0284c7" rx="4"/>
  <text x="110" y="278" font-family="sans-serif" font-size="14" font-weight="bold" fill="#ffffff">Start focus session</text>
  <!-- Side panel features -->
  <rect x="290" y="85" width="305" height="100" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="310" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">✓ Do Not Disturb Silencing</text>
  <text x="310" y="138" font-family="sans-serif" font-size="12" fill="#cbd5e1">Banners and alert sounds from WhatsApp, Discord,</text>
  <text x="310" y="156" font-family="sans-serif" font-size="12" fill="#cbd5e1">and Slack are automatically routed to Notification Center.</text>
  <rect x="290" y="205" width="305" height="100" fill="#0f172a" stroke="#334155" rx="6"/>
  <text x="310" y="235" font-family="sans-serif" font-size="14" font-weight="bold" fill="#10b981">✓ Keyboard Shortcut (Win + N)</text>
  <text x="310" y="258" font-family="sans-serif" font-size="12" fill="#cbd5e1">Quickly access the calendar flyout and trigger a</text>
  <text x="310" y="276" font-family="sans-serif" font-size="12" fill="#cbd5e1">session directly from your Windows taskbar.</text>
</svg>
