<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Web browser displaying LeechBlock blocking screen with calm blue background indicating page is blocked during study hours">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Browser top -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <circle cx="45" cy="41" r="6" fill="#ef4444"/>
  <circle cx="65" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="41" r="6" fill="#10b981"/>
  <rect x="110" y="30" width="340" height="22" fill="#ffffff" rx="4"/>
  <text x="120" y="46" font-family="sans-serif" font-size="12" fill="#64748b">https://www.youtube.com/</text>
  <!-- Block Page Content -->
  <rect x="80" y="90" width="480" height="220" fill="#f0fdfa" stroke="#99f6e4" rx="8"/>
  <circle cx="320" cy="140" r="28" fill="#0f766e"/>
  <text x="312" y="148" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">✓</text>
  <text x="320" y="195" font-family="sans-serif" font-size="20" font-weight="bold" fill="#0f766e" text-anchor="middle">Focus Sprints in Session</text>
  <text x="320" y="225" font-family="sans-serif" font-size="14" fill="#334155" text-anchor="middle">This domain is blocked under your scheduled study period.</text>
  <text x="320" y="250" font-family="sans-serif" font-size="13" fill="#64748b" text-anchor="middle">Resume your lab assignment or deep work. Free time opens at 17:30.</text>
  <rect x="260" y="270" width="120" height="30" fill="#0f766e" rx="4"/>
  <text x="320" y="290" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff" text-anchor="middle">Back to Work</text>
</svg>
