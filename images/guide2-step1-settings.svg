<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Android Settings screen showing Digital Wellbeing and parental controls option highlighted in the menu">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="180" y="10" width="280" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="20"/>
  <!-- Phone status bar -->
  <rect x="200" y="20" width="240" height="18" fill="#f1f5f9" rx="4"/>
  <text x="210" y="34" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">10:45</text>
  <text x="400" y="34" font-family="sans-serif" font-size="11" fill="#0f172a">85% 🔋</text>
  <!-- Settings Header -->
  <text x="210" y="65" font-family="sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Settings</text>
  <!-- List items -->
  <rect x="200" y="85" width="240" height="38" fill="#f8fafc" rx="6"/>
  <text x="215" y="108" font-family="sans-serif" font-size="13" fill="#334155">Network &amp; internet</text>
  <rect x="200" y="130" width="240" height="38" fill="#f8fafc" rx="6"/>
  <text x="215" y="153" font-family="sans-serif" font-size="13" fill="#334155">Display &amp; brightness</text>
  <!-- Highlighted item -->
  <rect x="195" y="175" width="250" height="48" fill="#ccfbf1" stroke="#0f766e" stroke-width="2" rx="6"/>
  <text x="215" y="197" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f766e">Digital Wellbeing</text>
  <text x="215" y="214" font-family="sans-serif" font-size="11" fill="#115e59">&amp; parental controls</text>
  <rect x="200" y="230" width="240" height="38" fill="#f8fafc" rx="6"/>
  <text x="215" y="253" font-family="sans-serif" font-size="13" fill="#334155">Privacy &amp; security</text>
  <!-- Side Callout text -->
  <rect x="470" y="140" width="155" height="120" fill="#f0fdfa" stroke="#99f6e4" rx="6"/>
  <text x="480" y="165" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f766e">Step 1 Action:</text>
  <text x="480" y="188" font-family="sans-serif" font-size="11" fill="#334155">Open Settings,</text>
  <text x="480" y="206" font-family="sans-serif" font-size="11" fill="#334155">scroll down to</text>
  <text x="480" y="224" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">Digital Wellbeing</text>
  <text x="480" y="242" font-family="sans-serif" font-size="11" fill="#334155">and tap to open.</text>
</svg>
