<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Android Bedtime mode scheduling screen showing start time 11:00 PM and end time 7:00 AM selected on Monday through Friday">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="180" y="10" width="280" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="20"/>
  <rect x="200" y="30" width="240" height="30" fill="#e0f2fe" rx="4"/>
  <text x="210" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0369a1">Bedtime mode routine</text>
  <text x="200" y="85" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Turn on based on schedule:</text>
  <!-- Time Pickers -->
  <rect x="200" y="100" width="115" height="48" fill="#f1f5f9" stroke="#cbd5e1" rx="6"/>
  <text x="210" y="120" font-family="sans-serif" font-size="11" fill="#64748b">Start time</text>
  <text x="210" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">11:00 PM</text>
  <rect x="325" y="100" width="115" height="48" fill="#f1f5f9" stroke="#cbd5e1" rx="6"/>
  <text x="335" y="120" font-family="sans-serif" font-size="11" fill="#64748b">End time</text>
  <text x="335" y="140" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">07:00 AM</text>
  <!-- Day circles -->
  <text x="200" y="175" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Repeat on:</text>
  <g transform="translate(200, 190)">
    <circle cx="14" cy="14" r="13" fill="#0f766e"/><text x="9" y="19" font-family="sans-serif" font-size="11" fill="#fff">M</text>
    <circle cx="48" cy="14" r="13" fill="#0f766e"/><text x="44" y="19" font-family="sans-serif" font-size="11" fill="#fff">T</text>
    <circle cx="82" cy="14" r="13" fill="#0f766e"/><text x="76" y="19" font-family="sans-serif" font-size="11" fill="#fff">W</text>
    <circle cx="116" cy="14" r="13" fill="#0f766e"/><text x="111" y="19" font-family="sans-serif" font-size="11" fill="#fff">T</text>
    <circle cx="150" cy="14" r="13" fill="#0f766e"/><text x="146" y="19" font-family="sans-serif" font-size="11" fill="#fff">F</text>
    <circle cx="184" cy="14" r="13" fill="#e2e8f0"/><text x="180" y="19" font-family="sans-serif" font-size="11" fill="#64748b">S</text>
    <circle cx="218" cy="14" r="13" fill="#e2e8f0"/><text x="214" y="19" font-family="sans-serif" font-size="11" fill="#64748b">S</text>
  </g>
  <rect x="200" y="240" width="240" height="70" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
  <text x="210" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Automated bedtime cycle</text>
  <text x="210" y="285" font-family="sans-serif" font-size="10" fill="#64748b">Allows your brain to wind down without</text>
  <text x="210" y="300" font-family="sans-serif" font-size="10" fill="#64748b">relying on late-night willpower.</text>
</svg>
