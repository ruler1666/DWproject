<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Android Bedtime customization settings showing Grayscale toggle switch enabled and screen colors desaturated">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="180" y="10" width="280" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="20"/>
  <text x="200" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Screen options at bedtime</text>
  <!-- Toggle Grayscale -->
  <rect x="200" y="70" width="240" height="65" fill="#f1f5f9" stroke="#cbd5e1" rx="6"/>
  <text x="210" y="95" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Grayscale</text>
  <text x="210" y="115" font-family="sans-serif" font-size="11" fill="#64748b">Changes screen to black and white</text>
  <!-- Switch ON -->
  <rect x="380" y="85" width="46" height="24" fill="#0f766e" rx="12"/>
  <circle cx="414" cy="97" r="9" fill="#ffffff"/>
  <!-- Keep screen dark -->
  <rect x="200" y="145" width="240" height="65" fill="#f1f5f9" stroke="#cbd5e1" rx="6"/>
  <text x="210" y="170" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Keep screen dark</text>
  <text x="210" y="190" font-family="sans-serif" font-size="11" fill="#64748b">Dim wallpaper &amp; use dark theme</text>
  <rect x="380" y="160" width="46" height="24" fill="#0f766e" rx="12"/>
  <circle cx="414" cy="172" r="9" fill="#ffffff"/>
  <!-- Explanation note -->
  <rect x="200" y="230" width="240" height="90" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
  <text x="210" y="255" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Neuroscience principle:</text>
  <text x="210" y="275" font-family="sans-serif" font-size="10" fill="#475569">Bright saturated colors (red notification dots,</text>
  <text x="210" y="290" font-family="sans-serif" font-size="10" fill="#475569">vivid thumbnails) stimulate dopamine release.</text>
  <text x="210" y="305" font-family="sans-serif" font-size="10" fill="#475569">Monochrome makes scrolling dull &amp; boring.</text>
</svg>
