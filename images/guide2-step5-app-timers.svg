<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Digital Wellbeing dashboard setting a 30-minute daily app timer limit for Instagram and YouTube">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="180" y="10" width="280" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="20"/>
  <text x="200" y="45" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">App timers</text>
  <!-- Instagram Row -->
  <rect x="200" y="65" width="240" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
  <rect x="210" y="77" width="30" height="30" fill="#e11d48" rx="6"/>
  <text x="217" y="98" font-family="sans-serif" font-size="16" fill="#fff">📸</text>
  <text x="250" y="88" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Instagram</text>
  <text x="250" y="106" font-family="sans-serif" font-size="11" fill="#0f766e">Timer: 30 mins / day</text>
  <rect x="390" y="78" width="38" height="28" fill="#e0f2fe" rx="4"/>
  <text x="398" y="96" font-family="sans-serif" font-size="14" fill="#0284c7">⏳</text>
  <!-- YouTube Row -->
  <rect x="200" y="130" width="240" height="55" fill="#f8fafc" stroke="#e2e8f0" rx="6"/>
  <rect x="210" y="142" width="30" height="30" fill="#dc2626" rx="6"/>
  <text x="217" y="163" font-family="sans-serif" font-size="16" fill="#fff">▶</text>
  <text x="250" y="153" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">YouTube</text>
  <text x="250" y="171" font-family="sans-serif" font-size="11" fill="#0f766e">Timer: 45 mins / day</text>
  <rect x="390" y="143" width="38" height="28" fill="#e0f2fe" rx="4"/>
  <text x="398" y="161" font-family="sans-serif" font-size="14" fill="#0284c7">⏳</text>
  <!-- Dialog preview -->
  <rect x="200" y="200" width="240" height="120" fill="#f0fdf4" stroke="#86efac" rx="6"/>
  <text x="210" y="225" font-family="sans-serif" font-size="12" font-weight="bold" fill="#15803d">Enforcement:</text>
  <text x="210" y="248" font-family="sans-serif" font-size="11" fill="#166534">Once the timer elapses, the app icon greys</text>
  <text x="210" y="265" font-family="sans-serif" font-size="11" fill="#166534">out on your home screen and shuts immediately</text>
  <text x="210" y="282" font-family="sans-serif" font-size="11" fill="#166534">if launched, gently halting doomscrolling.</text>
</svg>
