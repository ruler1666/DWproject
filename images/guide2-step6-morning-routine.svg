<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Morning lockscreen notification showing restful sleep summary and automatic color restoration at 7:00 AM">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="180" y="10" width="280" height="340" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="20"/>
  <!-- Status bar -->
  <text x="210" y="40" font-family="sans-serif" font-size="28" font-weight="bold" fill="#0f172a">07:05</text>
  <text x="210" y="60" font-family="sans-serif" font-size="12" fill="#64748b">Wednesday, October 28</text>
  <!-- Card -->
  <rect x="195" y="80" width="250" height="130" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="210" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f766e">🌅 Good morning!</text>
  <text x="210" y="128" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Bedtime mode turned off</text>
  <text x="210" y="150" font-family="sans-serif" font-size="11" fill="#475569">Full display colors restored.</text>
  <text x="210" y="168" font-family="sans-serif" font-size="11" fill="#475569">Zero nighttime notification alerts interrupted</text>
  <text x="210" y="186" font-family="sans-serif" font-size="11" fill="#475569">your sleep cycle between 11 PM and 7 AM.</text>
  <!-- Weekly report summary snippet -->
  <rect x="195" y="225" width="250" height="100" fill="#f0fdfa" stroke="#99f6e4" rx="8"/>
  <text x="210" y="250" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f766e">Weekly Result:</text>
  <text x="210" y="272" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">-1 hr 45 min screen time / day</text>
  <text x="210" y="292" font-family="sans-serif" font-size="11" fill="#115e59">Sleep onset latency reduced by ~40 minutes.</text>
</svg>
