<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Comparison showing YouTube homepage with algorithmically addictive Shorts shelf hidden by uBlock Origin cosmetic filters">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
