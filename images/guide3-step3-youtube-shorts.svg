  <text x="35" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">BEFORE: Addictive Traps</text>
  <rect x="35" y="70" width="255" height="90" fill="#ffffff" stroke="#fecaca" rx="4"/>
  <text x="45" y="95" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">⚡ YouTube Shorts Shelf</text>
  <text x="45" y="115" font-family="sans-serif" font-size="11" fill="#7f1d1d">Infinite 15-second vertical clips designed</text>
  <text x="45" y="130" font-family="sans-serif" font-size="11" fill="#7f1d1d">to hijack dopamine attention loops.</text>
  <rect x="35" y="175" width="255" height="70" fill="#ffffff" stroke="#fecaca" rx="4"/>
  <text x="45" y="200" font-family="sans-serif" font-size="12" font-weight="bold" fill="#dc2626">💬 Toxic Comments &amp; Arguments</text>
  <text x="45" y="220" font-family="sans-serif" font-size="11" fill="#7f1d1d">Distracts you from coding/lecture material.</text>
  <!-- After box -->
  <rect x="335" y="20" width="285" height="320" fill="#ecfdf5" stroke="#a7f3d0" stroke-width="2" rx="6"/>
  <text x="350" y="50" font-family="sans-serif" font-size="14" font-weight="bold" fill="#065f46">AFTER: Pure Focused Study</text>
  <rect x="350" y="70" width="255" height="175" fill="#ffffff" stroke="#a7f3d0" rx="4"/>
  <circle cx="475" cy="120" r="22" fill="#0f766e"/>
  <text x="468" y="127" font-family="sans-serif" font-size="18" fill="#ffffff">✓</text>
  <text x="475" y="165" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f766e" text-anchor="middle">Shorts &amp; Sidebars Completely Hidden</text>
  <text x="475" y="190" font-family="sans-serif" font-size="11" fill="#334155" text-anchor="middle">Only your intentional search video plays.</text>
  <text x="475" y="210" font-family="sans-serif" font-size="11" fill="#64748b" text-anchor="middle">Zero rabbit holes. Zero autoplay baits.</text>
