<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="uBlock Origin element picker eye-dropper tool selecting and zapping a clickbait sidebar recommendation box">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Simulated article page -->
  <rect x="40" y="40" width="340" height="280" fill="#f8fafc" stroke="#e2e8f0" rx="4"/>
  <text x="60" y="70" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">Data Structures Lecture Notes</text>
  <rect x="60" y="90" width="300" height="12" fill="#cbd5e1" rx="2"/>
  <rect x="60" y="112" width="280" height="12" fill="#cbd5e1" rx="2"/>
  <rect x="60" y="134" width="250" height="12" fill="#cbd5e1" rx="2"/>
  <rect x="60" y="156" width="290" height="12" fill="#cbd5e1" rx="2"/>
  <!-- Distracting sidebar targeted with element picker (red overlay) -->
  <rect x="400" y="40" width="200" height="200" fill="#fecaca" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" rx="4"/>
  <text x="415" y="70" font-family="sans-serif" font-size="12" font-weight="bold" fill="#991b1b">Targeted Element:</text>
  <text x="415" y="95" font-family="sans-serif" font-size="11" fill="#7f1d1d">"Trending Stories &amp; Viral News"</text>
  <!-- uBO Picker prompt dialog -->
  <rect x="400" y="255" width="200" height="65" fill="#1e293b" rx="4"/>
  <text x="415" y="278" font-family="sans-serif" font-size="11" fill="#f8fafc">Create cosmetic filter?</text>
  <rect x="415" y="288" width="60" height="24" fill="#0f766e" rx="3"/>
  <text x="430" y="304" font-family="sans-serif" font-size="11" font-weight="bold" fill="#fff">Create</text>
  <rect x="485" y="288" width="60" height="24" fill="#475569" rx="3"/>
  <text x="498" y="304" font-family="sans-serif" font-size="11" fill="#fff">Pick</text>
</svg>
