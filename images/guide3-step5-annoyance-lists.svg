<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="uBlock Origin Filter Lists dashboard showing Annoyances checkboxes EasyList Cookie and Fanboy Annoyance checked">
  <rect width="640" height="360" fill="#f8fafc" rx="8"/>
