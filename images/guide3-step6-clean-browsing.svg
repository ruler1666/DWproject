  <text x="320" y="195" font-family="sans-serif" font-size="13" fill="#475569" text-anchor="middle">Zero tracking scripts consuming phone battery or laptop RAM.</text>
  <text x="320" y="220" font-family="sans-serif" font-size="13" fill="#475569" text-anchor="middle">Zero auto-playing video players. Zero algorithmic recommendation loops.</text>
  <rect x="230" y="250" width="180" height="34" fill="#0f766e" rx="4"/>
