<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="StayFree installation and Android Usage Access permission screen">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <circle cx="45" cy="41" r="6" fill="#ef4444"/>
  <circle cx="65" cy="41" r="6" fill="#f59e0b"/>
  <circle cx="85" cy="41" r="6" fill="#10b981"/>
  <text x="110" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">Google Play Store &amp; Android Settings &gt; Usage Access</text>
  <!-- Phone Wireframe / Card -->
  <rect x="50" y="80" width="240" height="240" fill="#f8fafc" stroke="#cbd5e1" rx="12"/>
  <rect x="70" y="100" width="48" height="48" fill="#2563eb" rx="10"/>
  <text x="82" y="132" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">SF</text>
  <text x="130" y="118" font-family="sans-serif" font-size="16" font-weight="bold" fill="#0f172a">StayFree</text>
  <text x="130" y="138" font-family="sans-serif" font-size="12" fill="#64748b">Screen Time &amp; App Blocker</text>
  <!-- Permissions List -->
  <rect x="70" y="165" width="200" height="32" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="80" y="185" font-family="sans-serif" font-size="11" fill="#0f172a">Usage Data Access</text>
  <circle cx="250" cy="181" r="7" fill="#10b981"/>
  <text x="247" y="185" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">✓</text>
  <rect x="70" y="205" width="200" height="32" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="80" y="225" font-family="sans-serif" font-size="11" fill="#0f172a">Display Over Other Apps</text>
  <circle cx="250" cy="221" r="7" fill="#10b981"/>
  <text x="247" y="225" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">✓</text>
  <rect x="70" y="250" width="200" height="45" fill="#eff6ff" stroke="#bfdbfe" rx="6"/>
  <text x="80" y="268" font-family="sans-serif" font-size="10" font-weight="bold" fill="#1e40af">100% Local Processing</text>
  <text x="80" y="283" font-family="sans-serif" font-size="9" fill="#1e40af">Usage stays on your device.</text>
  <!-- Instructions right col -->
  <rect x="310" y="80" width="280" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="330" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 1: Install &amp; Grant Access</text>
  <text x="330" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Download StayFree from Google Play Store.</text>
  <text x="330" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Also install Chrome/Firefox extension on PC.</text>
  <text x="330" y="185" font-family="sans-serif" font-size="12" fill="#334155">• Enable 'Usage Access' in Android Settings.</text>
  <text x="330" y="210" font-family="sans-serif" font-size="12" fill="#334155">• Enable 'Appear on Top' so block screens work.</text>
  <text x="330" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">💡 Privacy Guarantee:</text>
  <text x="330" y="260" font-family="sans-serif" font-size="11" fill="#475569">No account or credit card required. Usage statistics</text>
  <text x="330" y="278" font-family="sans-serif" font-size="11" fill="#475569">are logged entirely within local phone storage.</text>
</svg>