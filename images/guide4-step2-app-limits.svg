<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="StayFree app limits configuration for social and entertainment apps">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">StayFree &gt; Usage Limits &gt; Add Daily Limit</text>
  <!-- Limits list card -->
  <rect x="50" y="80" width="310" height="240" fill="#f8fafc" stroke="#cbd5e1" rx="8"/>
  <text x="70" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Configured Student Daily Quotas</text>
  <!-- Row 1: Instagram -->
  <rect x="70" y="120" width="270" height="42" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <rect x="80" y="128" width="26" height="26" fill="#e11d48" rx="6"/>
  <text x="115" y="145" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Instagram</text>
  <rect x="250" y="130" width="80" height="22" fill="#fee2e2" rx="4"/>
  <text x="260" y="145" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">30 min/day</text>
  <!-- Row 2: YouTube -->
  <rect x="70" y="170" width="270" height="42" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <rect x="80" y="178" width="26" height="26" fill="#dc2626" rx="6"/>
  <text x="115" y="195" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">YouTube</text>
  <rect x="250" y="180" width="80" height="22" fill="#fef3c7" rx="4"/>
  <text x="260" y="195" font-family="sans-serif" font-size="11" font-weight="bold" fill="#92400e">45 min/day</text>
  <!-- Row 3: Reddit / Discord -->
  <rect x="70" y="220" width="270" height="42" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <rect x="80" y="228" width="26" height="26" fill="#ea580c" rx="6"/>
  <text x="115" y="245" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Reddit / X</text>
  <rect x="250" y="230" width="80" height="22" fill="#fee2e2" rx="4"/>
  <text x="260" y="245" font-family="sans-serif" font-size="11" font-weight="bold" fill="#991b1b">20 min/day</text>
  <!-- Warning badge -->
  <rect x="70" y="272" width="270" height="32" fill="#f0fdf4" stroke="#bbf7d0" rx="6"/>
  <text x="80" y="292" font-family="sans-serif" font-size="11" fill="#166534">✓ Auto-block triggers when timer hits 0m</text>
  <!-- Right Instructions -->
  <rect x="380" y="80" width="210" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="395" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 2: Set Quotas</text>
  <text x="395" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Tap '+' &gt; App Usage Limit.</text>
  <text x="395" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Choose distraction apps.</text>
  <text x="395" y="185" font-family="sans-serif" font-size="12" fill="#334155">• Set realistic caps (30m).</text>
  <text x="395" y="210" font-family="sans-serif" font-size="12" fill="#334155">• Choose 'Block Access'</text>
  <text x="395" y="230" font-family="sans-serif" font-size="12" fill="#334155">  instead of soft warning.</text>
  <text x="395" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Pro Tip:</text>
  <text x="395" y="280" font-family="sans-serif" font-size="11" fill="#475569">Set warning at 80% usage.</text>
</svg>