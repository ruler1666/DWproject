<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="StayFree Study Session and Pomodoro Focus Mode setup">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">StayFree &gt; Focus Mode &gt; Study Sprint Session</text>
  <!-- Focus Mode Screen -->
  <rect x="50" y="80" width="280" height="240" fill="#0f172a" rx="10"/>
  <circle cx="190" cy="165" r="50" fill="none" stroke="#334155" stroke-width="8"/>
  <circle cx="190" cy="165" r="50" fill="none" stroke="#2563eb" stroke-width="8" stroke-dasharray="240" stroke-dashoffset="60"/>
  <text x="160" y="172" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">50:00</text>
  <text x="145" y="195" font-family="sans-serif" font-size="11" fill="#94a3b8">STUDY FOCUS ACTIVE</text>
  <rect x="100" y="235" width="180" height="36" fill="#2563eb" rx="18"/>
  <text x="145" y="258" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">Session Running</text>
  <text x="90" y="295" font-family="sans-serif" font-size="11" fill="#64748b">14 Distracting Apps Locked Down</text>
  <!-- Right Instructions -->
  <rect x="350" y="80" width="240" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="370" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 3: Launch Focus Mode</text>
  <text x="370" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Go to 'Focus Mode' tab.</text>
  <text x="370" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Set duration: 50 mins focus</text>
  <text x="370" y="180" font-family="sans-serif" font-size="12" fill="#334155">  followed by 10 mins break.</text>
  <text x="370" y="205" font-family="sans-serif" font-size="12" fill="#334155">• Select 'Strict Lock' profile.</text>
  <text x="370" y="230" font-family="sans-serif" font-size="12" fill="#334155">• Whitelist Study Apps:</text>
  <text x="370" y="250" font-family="sans-serif" font-size="11" fill="#0f766e">  Notion, Drive, PDF Reader.</text>
  <text x="370" y="275" font-family="sans-serif" font-size="11" fill="#475569">Social apps display blocked alert.</text>
</svg>