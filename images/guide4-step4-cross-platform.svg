<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="StayFree cross platform sync between Android phone and laptop browser">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">StayFree &gt; Connected Devices &gt; Laptop Browser Pairing</text>
  <!-- Device diagram -->
  <rect x="50" y="85" width="130" height="210" fill="#f8fafc" stroke="#cbd5e1" rx="10"/>
  <text x="80" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">📱 Phone</text>
  <text x="65" y="140" font-family="sans-serif" font-size="11" fill="#64748b">Android Handset</text>
  <rect x="65" y="160" width="100" height="50" fill="#eff6ff" rx="6"/>
  <text x="75" y="180" font-family="sans-serif" font-size="10" fill="#1e40af">App Usage:</text>
  <text x="75" y="200" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">2h 15m</text>
  <!-- Sync Arrow -->
  <path d="M200 190 h60" stroke="#2563eb" stroke-width="3" stroke-dasharray="4"/>
  <polygon points="260,185 270,190 260,195" fill="#2563eb"/>
  <text x="210" y="175" font-family="sans-serif" font-size="10" font-weight="bold" fill="#2563eb">SYNC</text>
  <!-- Laptop diagram -->
  <rect x="280" y="85" width="160" height="210" fill="#f8fafc" stroke="#cbd5e1" rx="10"/>
  <text x="310" y="115" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">💻 Laptop</text>
  <text x="300" y="140" font-family="sans-serif" font-size="11" fill="#64748b">Chrome / Firefox Ext.</text>
  <rect x="295" y="160" width="130" height="50" fill="#eff6ff" rx="6"/>
  <text x="305" y="180" font-family="sans-serif" font-size="10" fill="#1e40af">Web Usage:</text>
  <text x="305" y="200" font-family="sans-serif" font-size="14" font-weight="bold" fill="#1e40af">1h 40m</text>
  <!-- Summary Box -->
  <rect x="460" y="85" width="140" height="210" fill="#f1f5f9" stroke="#cbd5e1" rx="8"/>
  <text x="475" y="115" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Step 4: Sync</text>
  <text x="475" y="135" font-family="sans-serif" font-size="11" fill="#334155">• Optional cloud sync</text>
  <text x="475" y="155" font-family="sans-serif" font-size="11" fill="#334155">  for unified views.</text>
  <text x="475" y="180" font-family="sans-serif" font-size="11" fill="#334155">• Prevents loophole of</text>
  <text x="475" y="200" font-family="sans-serif" font-size="11" fill="#334155">  switching to PC</text>
  <text x="475" y="220" font-family="sans-serif" font-size="11" fill="#334155">  when phone locks.</text>
  <text x="475" y="250" font-family="sans-serif" font-size="10" font-weight="bold" fill="#0f766e">Combined Total: 3h 55m</text>
</svg>