<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="StayFree anti cheat friction and PIN security protection">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">StayFree &gt; Security &gt; Anti-Cheat &amp; PIN Protection</text>
  <!-- Security card -->
  <rect x="50" y="80" width="280" height="240" fill="#f8fafc" stroke="#cbd5e1" rx="10"/>
  <circle cx="190" cy="130" r="26" fill="#fee2e2"/>
  <text x="180" y="138" font-family="sans-serif" font-size="22">🔒</text>
  <text x="110" y="175" font-family="sans-serif" font-size="14" font-weight="bold" fill="#991b1b">Strict Mode Activated</text>
  <rect x="80" y="195" width="220" height="34" fill="#ffffff" stroke="#fca5a5" rx="6"/>
  <text x="95" y="217" font-family="sans-serif" font-size="12" fill="#334155">Cooldown: 60s Delay to Edit</text>
  <rect x="80" y="240" width="220" height="34" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="95" y="262" font-family="sans-serif" font-size="12" fill="#334155">Prevent App Uninstallation: ON</text>
  <text x="80" y="295" font-family="sans-serif" font-size="10" fill="#64748b">No bypassing during study hours.</text>
  <!-- Right Instructions -->
  <rect x="350" y="80" width="240" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="370" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 5: Lock Down Settings</text>
  <text x="370" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Open Settings &gt; Security.</text>
  <text x="370" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Set 4-digit PIN code</text>
  <text x="370" y="180" font-family="sans-serif" font-size="12" fill="#334155">  (or let a study buddy set it).</text>
  <text x="370" y="205" font-family="sans-serif" font-size="12" fill="#334155">• Turn on 'Edit Delay Timer'.</text>
  <text x="370" y="230" font-family="sans-serif" font-size="12" fill="#334155">• Toggle 'Block Uninstall' to</text>
  <text x="370" y="250" font-family="sans-serif" font-size="12" fill="#334155">  stop impulse deletion.</text>
  <text x="370" y="275" font-family="sans-serif" font-size="11" font-weight="bold" fill="#b91c1c">Anti-Cheating Friction Active</text>
</svg>