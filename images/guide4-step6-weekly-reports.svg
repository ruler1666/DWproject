<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="StayFree weekly screen time analytics and reduction chart">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">StayFree &gt; Analytics &gt; Weekly Trend Report</text>
  <!-- Chart Card -->
  <rect x="50" y="80" width="310" height="240" fill="#f8fafc" stroke="#cbd5e1" rx="10"/>
  <text x="70" y="105" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Daily Screen Time This Week</text>
  <text x="260" y="105" font-family="sans-serif" font-size="12" font-weight="bold" fill="#16a34a">-38% vs Last Wk</text>
  <!-- Bar chart -->
  <rect x="75" y="180" width="25" height="100" fill="#93c5fd" rx="3"/>
  <text x="78" y="295" font-family="sans-serif" font-size="10" fill="#64748b">M</text>
  <rect x="110" y="160" width="25" height="120" fill="#93c5fd" rx="3"/>
  <text x="113" y="295" font-family="sans-serif" font-size="10" fill="#64748b">T</text>
  <rect x="145" y="200" width="25" height="80" fill="#93c5fd" rx="3"/>
  <text x="148" y="295" font-family="sans-serif" font-size="10" fill="#64748b">W</text>
  <rect x="180" y="210" width="25" height="70" fill="#93c5fd" rx="3"/>
  <text x="183" y="295" font-family="sans-serif" font-size="10" fill="#64748b">T</text>
  <rect x="215" y="220" width="25" height="60" fill="#2563eb" rx="3"/>
  <text x="218" y="295" font-family="sans-serif" font-size="10" fill="#64748b">F</text>
  <rect x="250" y="230" width="25" height="50" fill="#2563eb" rx="3"/>
  <text x="253" y="295" font-family="sans-serif" font-size="10" fill="#64748b">S</text>
  <rect x="285" y="235" width="25" height="45" fill="#2563eb" rx="3"/>
  <text x="288" y="295" font-family="sans-serif" font-size="10" fill="#64748b">S</text>
  <!-- Trendline -->
  <line x1="85" y1="180" x2="300" y2="235" stroke="#16a34a" stroke-width="2"/>
  <text x="75" y="140" font-family="sans-serif" font-size="12" fill="#0f172a">Average: <strong>2h 18m</strong> / day</text>
  <!-- Right Instructions -->
  <rect x="380" y="80" width="210" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="395" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 6: Review Insights</text>
  <text x="395" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Check weekly charts.</text>
  <text x="395" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Identify peak trigger hours</text>
  <text x="395" y="180" font-family="sans-serif" font-size="12" fill="#334155">  (e.g., 10 PM - 12 AM).</text>
  <text x="395" y="205" font-family="sans-serif" font-size="12" fill="#334155">• Adjust quotas downwards</text>
  <text x="395" y="225" font-family="sans-serif" font-size="12" fill="#334155">  by 5 mins each week.</text>
  <text x="395" y="255" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">✓ Habit Formation Goal Met</text>
</svg>