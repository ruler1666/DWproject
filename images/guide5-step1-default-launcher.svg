<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Setting minimalist phone as default home launcher in Android settings">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">Android Settings &gt; Default Apps &gt; Home App</text>
  <!-- Dialog Wireframe -->
  <rect x="50" y="80" width="280" height="240" fill="#f8fafc" stroke="#cbd5e1" rx="10"/>
  <text x="70" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Select a Home App</text>
  <!-- Radio 1: Old Launcher -->
  <rect x="70" y="130" width="240" height="40" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <circle cx="90" cy="150" r="8" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="110" y="155" font-family="sans-serif" font-size="12" fill="#64748b">Quickstep / Stock Launcher</text>
  <!-- Radio 2: minimalist phone Selected -->
  <rect x="70" y="180" width="240" height="48" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" rx="6"/>
  <circle cx="90" cy="204" r="8" fill="#3b82f6"/>
  <circle cx="90" cy="204" r="3" fill="#ffffff"/>
  <text x="110" y="202" font-family="sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">minimalist phone</text>
  <text x="110" y="218" font-family="sans-serif" font-size="10" fill="#2563eb">Selected default home app</text>
  <!-- Always button -->
  <rect x="180" y="245" width="130" height="35" fill="#0f172a" rx="6"/>
  <text x="210" y="267" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Set as Always</text>
  <!-- Right Instructions -->
  <rect x="350" y="80" width="240" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="370" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 1: Set Default Launcher</text>
  <text x="370" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Install minimalist phone.</text>
  <text x="370" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Press your phone's Home button.</text>
  <text x="370" y="185" font-family="sans-serif" font-size="12" fill="#334155">• Select 'minimalist phone'.</text>
  <text x="370" y="210" font-family="sans-serif" font-size="12" fill="#334155">• Tap 'Always'.</text>
  <text x="370" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">💡 Quick Revert:</text>
  <text x="370" y="260" font-family="sans-serif" font-size="11" fill="#475569">You can switch back anytime in</text>
  <text x="370" y="278" font-family="sans-serif" font-size="11" fill="#475569">Settings &gt; Default Apps &gt; Home.</text>
</svg>