<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="minimalist phone clean monochrome text-based home screen setup">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">minimalist phone &gt; Home Screen Curation</text>
  <!-- Dark Minimal Phone Screen -->
  <rect x="60" y="80" width="220" height="240" fill="#000000" rx="16"/>
  <!-- Clock &amp; Battery -->
  <text x="80" y="115" font-family="monospace" font-size="28" font-weight="bold" fill="#ffffff">09:41</text>
  <text x="80" y="135" font-family="sans-serif" font-size="11" fill="#71717a">Wednesday, Nov 18 &#8226; 82%</text>
  <!-- Text-only essential app list -->
  <text x="80" y="175" font-family="sans-serif" font-size="16" fill="#ffffff">phone</text>
  <text x="80" y="205" font-family="sans-serif" font-size="16" fill="#ffffff">messages</text>
  <text x="80" y="235" font-family="sans-serif" font-size="16" fill="#ffffff">notion</text>
  <text x="80" y="265" font-family="sans-serif" font-size="16" fill="#ffffff">canvas lms</text>
  <text x="80" y="295" font-family="sans-serif" font-size="12" fill="#52525b">swipe right for all apps &#8594;</text>
  <!-- Right Instructions -->
  <rect x="310" y="80" width="280" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="330" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 2: Curate 4-6 Essentials</text>
  <text x="330" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Choose only functional tools for Home.</text>
  <text x="330" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Recommended: Phone, Messaging,</text>
  <text x="330" y="180" font-family="sans-serif" font-size="12" fill="#334155">  Notes/Notion, and University LMS.</text>
  <text x="330" y="205" font-family="sans-serif" font-size="12" fill="#334155">• Zero app icons or red notification dots.</text>
  <text x="330" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">Psychological Benefit:</text>
  <text x="330" y="255" font-family="sans-serif" font-size="11" fill="#475569">Text eliminates the instant visual dopamine hook</text>
  <text x="330" y="275" font-family="sans-serif" font-size="11" fill="#475569">that colorful app icons trigger in your brain.</text>
</svg>