<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Hiding and blocking distraction apps in minimalist phone launcher">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">minimalist phone &gt; App Options &gt; Hide &amp; Block Apps</text>
  <!-- Long press menu on dark screen -->
  <rect x="50" y="80" width="260" height="240" fill="#09090b" rx="10"/>
  <text x="70" y="110" font-family="sans-serif" font-size="16" fill="#a1a1aa">instagram</text>
  <!-- Popup context menu -->
  <rect x="70" y="125" width="220" height="175" fill="#18181b" stroke="#27272a" rx="8"/>
  <text x="90" y="152" font-family="sans-serif" font-size="13" font-weight="bold" fill="#ffffff">instagram options</text>
  <line x1="70" y1="165" x2="290" y2="165" stroke="#27272a"/>
  <!-- Option 1: Hide -->
  <rect x="80" y="175" width="200" height="30" fill="#27272a" rx="4"/>
  <text x="95" y="195" font-family="sans-serif" font-size="12" fill="#e4e4e7">👁 Hide app (removes from list)</text>
  <!-- Option 2: Block -->
  <rect x="80" y="215" width="200" height="30" fill="#7f1d1d" rx="4"/>
  <text x="95" y="235" font-family="sans-serif" font-size="12" font-weight="bold" fill="#fecaca">🚫 Block app for 24 hours</text>
  <!-- Option 3: Rename -->
  <text x="95" y="275" font-family="sans-serif" font-size="11" fill="#71717a">Rename or remove</text>
  <!-- Right Instructions -->
  <rect x="330" y="80" width="260" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="350" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 3: Hide Compulsive Apps</text>
  <text x="350" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Swipe right to see the full app list.</text>
  <text x="350" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Long-press on social media or games.</text>
  <text x="350" y="185" font-family="sans-serif" font-size="12" fill="#334155">• Tap 'Hide' to remove from sight.</text>
  <text x="350" y="210" font-family="sans-serif" font-size="12" fill="#334155">• During exam prep, choose 'Block for 24h'.</text>
  <text x="350" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">Out of Sight, Out of Mind:</text>
  <text x="350" y="260" font-family="sans-serif" font-size="11" fill="#475569">Adding even 2 extra steps to find an app cuts</text>
  <text x="350" y="278" font-family="sans-serif" font-size="11" fill="#475569">mindless opens by over 60%.</text>
</svg>