<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Configuring high contrast monochrome AMOLED theme in minimalist phone">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">minimalist phone &gt; Settings &gt; Theme &amp; Typography</text>
  <!-- Theme previews -->
  <rect x="50" y="80" width="130" height="230" fill="#000000" stroke="#3b82f6" stroke-width="2" rx="8"/>
  <text x="75" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Pure Black</text>
  <text x="75" y="135" font-family="sans-serif" font-size="10" fill="#a1a1aa">AMOLED Dark</text>
  <circle cx="115" cy="180" r="16" fill="#000000" stroke="#ffffff" stroke-width="2"/>
  <text x="110" y="185" font-family="sans-serif" font-size="11" fill="#ffffff">Aa</text>
  <rect x="70" y="240" width="90" height="24" fill="#3b82f6" rx="4"/>
  <text x="85" y="256" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Active Theme</text>
  <!-- White theme preview -->
  <rect x="195" y="80" width="130" height="230" fill="#ffffff" stroke="#cbd5e1" rx="8"/>
  <text x="220" y="110" font-family="sans-serif" font-size="12" font-weight="bold" fill="#0f172a">Pure White</text>
  <text x="220" y="135" font-family="sans-serif" font-size="10" fill="#64748b">Day Reading</text>
  <circle cx="260" cy="180" r="16" fill="#ffffff" stroke="#0f172a" stroke-width="2"/>
  <text x="255" y="185" font-family="sans-serif" font-size="11" fill="#0f172a">Aa</text>
  <!-- Right Instructions -->
  <rect x="345" y="80" width="245" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="365" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 4: Monochrome Theme</text>
  <text x="365" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Long press empty home area.</text>
  <text x="365" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Tap 'Settings' &gt; 'Theme'.</text>
  <text x="365" y="185" font-family="sans-serif" font-size="12" fill="#334155">• Select 'Pure Black' (AMOLED).</text>
  <text x="365" y="210" font-family="sans-serif" font-size="12" fill="#334155">• Set font size to Medium/Large.</text>
  <text x="365" y="240" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">Battery &amp; Eye Wellness:</text>
  <text x="365" y="260" font-family="sans-serif" font-size="11" fill="#475569">True black turns off OLED pixels,</text>
  <text x="365" y="278" font-family="sans-serif" font-size="11" fill="#475569">saving up to 30% battery and easing eye fatigue.</text>
</svg>