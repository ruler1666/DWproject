<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="15-second mindful opening delay and breathing pause before opening apps">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">minimalist phone &gt; Mindful Breathing Pause</text>
  <!-- Breathing Pause Card -->
  <rect x="50" y="80" width="280" height="240" fill="#09090b" rx="12"/>
  <circle cx="190" cy="155" r="45" fill="none" stroke="#27272a" stroke-width="6"/>
  <circle cx="190" cy="155" r="45" fill="none" stroke="#10b981" stroke-width="6" stroke-dasharray="200" stroke-dashoffset="60"/>
  <text x="175" y="165" font-family="sans-serif" font-size="28" font-weight="bold" fill="#ffffff">15s</text>
  <text x="135" y="225" font-family="sans-serif" font-size="12" fill="#a1a1aa">Take a deep breath...</text>
  <text x="105" y="245" font-family="sans-serif" font-size="11" fill="#71717a">Do you really need to open this right now?</text>
  <!-- Cancel Button -->
  <rect x="130" y="265" width="120" height="32" fill="#27272a" rx="6"/>
  <text x="155" y="285" font-family="sans-serif" font-size="12" font-weight="bold" fill="#ffffff">Don't Open</text>
  <!-- Right Instructions -->
  <rect x="350" y="80" width="240" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="370" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 5: Mindful Delay</text>
  <text x="370" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Long press distracting app.</text>
  <text x="370" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Tap 'Opening Delay'.</text>
  <text x="370" y="185" font-family="sans-serif" font-size="12" fill="#334155">• Set timer: 15 seconds.</text>
  <text x="370" y="210" font-family="sans-serif" font-size="12" fill="#334155">• When tapped, a calm breathing</text>
  <text x="370" y="230" font-family="sans-serif" font-size="12" fill="#334155">  counter intercepts the launch.</text>
  <text x="370" y="260" font-family="sans-serif" font-size="11" font-weight="bold" fill="#10b981">Impulse Breaker:</text>
  <text x="370" y="278" font-family="sans-serif" font-size="11" fill="#475569">Gives your prefrontal cortex time to cancel.</text>
</svg>