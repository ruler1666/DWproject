<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%" role="img" aria-label="Notification filter batching and 15-minute in-app usage reminder">
  <rect width="640" height="360" fill="#f1f5f9" rx="8"/>
  <rect x="20" y="20" width="600" height="320" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" rx="6"/>
  <!-- Top bar -->
  <rect x="20" y="20" width="600" height="42" fill="#e2e8f0" rx="6"/>
  <text x="45" y="46" font-family="sans-serif" font-size="13" font-weight="bold" fill="#334155">minimalist phone &gt; Notification Filter &amp; In-App Reminder</text>
  <!-- Card Wireframe -->
  <rect x="50" y="80" width="280" height="240" fill="#f8fafc" stroke="#cbd5e1" rx="10"/>
  <text x="70" y="110" font-family="sans-serif" font-size="13" font-weight="bold" fill="#0f172a">Notification Filter Settings</text>
  <!-- Row 1: WhatsApp -->
  <rect x="70" y="125" width="240" height="35" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="85" y="147" font-family="sans-serif" font-size="11" fill="#0f172a">WhatsApp / Calls</text>
  <text x="240" y="147" font-family="sans-serif" font-size="11" font-weight="bold" fill="#16a34a">Allowed</text>
  <!-- Row 2: Instagram / TikTok -->
  <rect x="70" y="170" width="240" height="35" fill="#ffffff" stroke="#e2e8f0" rx="6"/>
  <text x="85" y="192" font-family="sans-serif" font-size="11" fill="#0f172a">Social Media Alerts</text>
  <text x="240" y="192" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2563eb">Batched</text>
  <!-- Reminder Box -->
  <rect x="70" y="220" width="240" height="80" fill="#eff6ff" stroke="#bfdbfe" rx="6"/>
  <text x="85" y="245" font-family="sans-serif" font-size="11" font-weight="bold" fill="#1e40af">In-App Exit Reminder:</text>
  <text x="85" y="265" font-family="sans-serif" font-size="10" fill="#1e40af">"You've been here 15 mins. Ready to close?"</text>
  <text x="85" y="285" font-family="sans-serif" font-size="9" fill="#64748b">Displays gentle popup without harsh crashing.</text>
  <!-- Right Instructions -->
  <rect x="350" y="80" width="240" height="240" fill="#f8fafc" stroke="#e2e8f0" rx="8"/>
  <text x="370" y="110" font-family="sans-serif" font-size="14" font-weight="bold" fill="#0f172a">Step 6: Batch &amp; Remind</text>
  <text x="370" y="135" font-family="sans-serif" font-size="12" fill="#334155">• Enable 'Notification Filter'.</text>
  <text x="370" y="160" font-family="sans-serif" font-size="12" fill="#334155">• Batch non-urgent alerts to</text>
  <text x="370" y="180" font-family="sans-serif" font-size="12" fill="#334155">  arrive 3 times a day (12, 5, 9).</text>
  <text x="370" y="205" font-family="sans-serif" font-size="12" fill="#334155">• Set in-app reminder to 15m.</text>
  <text x="370" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#0f766e">Final Verification:</text>
  <text x="370" y="255" font-family="sans-serif" font-size="11" fill="#475569">You now have a clean, calm,</text>
  <text x="370" y="275" font-family="sans-serif" font-size="11" fill="#475569">friction-backed student smartphone.</text>
</svg>