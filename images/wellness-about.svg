<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none" role="img" aria-label="Student digital wellness research and editorial ethics">
  <defs>
    <linearGradient id="abt-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="abt-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f0fdfa"/>
    </linearGradient>
    <filter id="abt-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="20" fill="url(#abt-bg)"/>

  <!-- Center Circle Illustration: Calm Mindful Student Workspace -->
  <g transform="translate(300, 170)">
    <circle r="125" fill="#ffffff" filter="url(#abt-shadow)"/>
    <circle r="115" fill="#f0fdfa"/>
    <!-- Student Desk Scene -->
    <!-- Desk surface -->
    <rect x="-85" y="45" width="170" height="8" rx="4" fill="#94a3b8"/>
    <!-- Plant in pot -->
    <rect x="-70" y="20" width="18" height="25" rx="3" fill="#0d9488"/>
    <path d="M-61 20 C-65 5 -45 5 -61 20" fill="#2dd4bf"/>
    <path d="M-61 20 C-57 8 -75 8 -61 20" fill="#14b8a6"/>
    <!-- Steaming Mug -->
    <rect x="52" y="28" width="16" height="17" rx="3" fill="#cbd5e1"/>
    <path d="M68 33 C72 33 72 40 68 40" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    <path d="M57 23 C57 18 63 18 63 13" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" fill="none"/>
    <!-- Open Book / Study Materials -->
    <polygon points="-30,45 -30,28 -5,26 -5,45" fill="#ffffff" stroke="#cbd5e1"/>
    <polygon points="30,45 30,28 5,26 5,45" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Calming Sun/Aura behind -->
    <circle cx="0" cy="-25" r="45" fill="#ccfbf1" opacity="0.6"/>
    <path d="M0 -55 L0 -65 M21 -46 L28 -53 M30 -25 L40 -25 M21 -4 L28 3 M0 5 L0 15 M-21 -4 L-28 3 M-30 -25 L-40 -25 M-21 -46 L-28 -53" stroke="#0d9488" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
    <circle cx="0" cy="-25" r="18" fill="url(#abt-grad)"/>
    <path d="M-6 -25 L-1 -20 L7 -29" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Floating Callout Left: 25+ Screened -->
  <g transform="translate(50, 80)" filter="url(#abt-shadow)">
    <rect width="145" height="75" rx="12" fill="#ffffff"/>
    <text x="18" y="30" font-family="system-ui,sans-serif" font-size="20" font-weight="900" fill="#0d9488">25+ Apps</text>
    <text x="18" y="48" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Screened In-Lab</text>
    <text x="18" y="62" font-family="system-ui,sans-serif" font-size="8.5" fill="#64748b">Only 11 met strict standards</text>
  </g>

  <!-- Floating Callout Right: Zero Sponsored -->
  <g transform="translate(405, 210)" filter="url(#abt-shadow)">
    <rect width="145" height="75" rx="12" fill="#ffffff"/>
    <text x="18" y="30" font-family="system-ui,sans-serif" font-size="20" font-weight="900" fill="#0284c7">0 Sponsors</text>
    <text x="18" y="48" font-family="system-ui,sans-serif" font-size="10" font-weight="bold" fill="#0f172a">Zero Affiliate Fees</text>
    <text x="18" y="62" font-family="system-ui,sans-serif" font-size="8.5" fill="#64748b">100% Student funded &amp; run</text>
  </g>
</svg>