<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none" role="img" aria-label="Student setup guides roadmap illustration">
  <defs>
    <linearGradient id="gds-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="gds-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="gds-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="20" fill="url(#gds-bg)"/>

  <!-- S-Curve Roadmap Path -->
  <path d="M70 180 Q180 80 300 180 T530 180" stroke="#0d9488" stroke-width="4" stroke-dasharray="8 6" fill="none"/>

  <!-- Milestone 1: Guide 1 (Windows Focus) -->
  <g transform="translate(100, 120)" filter="url(#gds-shadow)">
    <circle cx="20" cy="20" r="24" fill="#ffffff" stroke="#0d9488" stroke-width="3"/>
    <text x="20" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#0d9488" text-anchor="middle">01</text>
    <rect x="-20" y="52" width="80" height="26" rx="6" fill="#1e293b"/>
    <text x="20" y="68" font-family="system-ui,sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Windows Focus</text>
  </g>

  <!-- Milestone 2: Guide 2 (Bedtime Mode) -->
  <g transform="translate(195, 210)" filter="url(#gds-shadow)">
    <circle cx="20" cy="20" r="24" fill="#ffffff" stroke="#6366f1" stroke-width="3"/>
    <text x="20" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#6366f1" text-anchor="middle">02</text>
    <rect x="-20" y="52" width="80" height="26" rx="6" fill="#1e293b"/>
    <text x="20" y="68" font-family="system-ui,sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Bedtime Sleep</text>
  </g>

  <!-- Milestone 3: Guide 3 (Feed Cleanse) -->
  <g transform="translate(290, 110)" filter="url(#gds-shadow)">
    <circle cx="20" cy="20" r="24" fill="#ffffff" stroke="#0284c7" stroke-width="3"/>
    <text x="20" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#0284c7" text-anchor="middle">03</text>
    <rect x="-20" y="52" width="80" height="26" rx="6" fill="#1e293b"/>
    <text x="20" y="68" font-family="system-ui,sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">Feed Cleanse</text>
  </g>

  <!-- Milestone 4: Guide 4 (StayFree) -->
  <g transform="translate(385, 210)" filter="url(#gds-shadow)">
    <circle cx="20" cy="20" r="24" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
    <text x="20" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#10b981" text-anchor="middle">04</text>
    <rect x="-20" y="52" width="80" height="26" rx="6" fill="#1e293b"/>
    <text x="20" y="68" font-family="system-ui,sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">StayFree Sync</text>
  </g>

  <!-- Milestone 5: Guide 5 (minimalist phone) -->
  <g transform="translate(475, 120)" filter="url(#gds-shadow)">
    <circle cx="20" cy="20" r="24" fill="#ffffff" stroke="#0f172a" stroke-width="3"/>
    <text x="20" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="900" fill="#0f172a" text-anchor="middle">05</text>
    <rect x="-25" y="52" width="90" height="26" rx="6" fill="#1e293b"/>
    <text x="20" y="68" font-family="system-ui,sans-serif" font-size="8.5" font-weight="bold" fill="#ffffff" text-anchor="middle">minimalist phone</text>
  </g>

  <!-- Top Banner: 5 Complete Guides -->
  <g transform="translate(180, 25)" filter="url(#gds-shadow)">
    <rect width="240" height="36" rx="18" fill="url(#gds-grad)"/>
    <text x="120" y="23" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#ffffff" text-anchor="middle">5 Field-Tested Guides &#8226; 30 Wireframes</text>
  </g>
</svg>