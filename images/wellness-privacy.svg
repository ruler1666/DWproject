<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%" fill="none" role="img" aria-label="Student privacy and data safety illustration">
  <defs>
    <linearGradient id="prv-shield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="prv-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#ecfeff"/>
    </linearGradient>
    <filter id="prv-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="600" height="360" rx="20" fill="url(#prv-bg)"/>

  <!-- Concentric Security Ripples -->
  <circle cx="300" cy="180" r="150" stroke="#0d9488" stroke-width="1" stroke-dasharray="6 6" opacity="0.3"/>
  <circle cx="300" cy="180" r="110" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <circle cx="300" cy="180" r="75" fill="#ccfbf1" opacity="0.4"/>

  <!-- Central Security Shield -->
  <g transform="translate(300, 175)" filter="url(#prv-shadow)">
    <path d="M0 -65 L55 -38 C55 35 25 75 0 95 C-25 75 -55 35 -55 -38 Z" fill="url(#prv-shield)"/>
    <path d="M0 -55 L45 -32 C45 28 20 62 0 80 C-20 62 -45 28 -45 -32 Z" fill="#0f766e" opacity="0.4"/>
    <!-- Padlock Icon inside Shield -->
    <rect x="-18" y="-5" width="36" height="30" rx="5" fill="#ffffff"/>
    <path d="M-11 -5 L-11 -16 C-11 -24 11 -24 11 -16 L11 -5" stroke="#ffffff" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <circle cx="0" cy="8" r="4" fill="#0d9488"/>
    <rect x="-2" y="8" width="4" height="8" rx="1.5" fill="#0d9488"/>
  </g>

  <!-- Left: Android Permissions Guard -->
  <g transform="translate(60, 100)" filter="url(#prv-shadow)">
    <rect width="170" height="150" rx="12" fill="#ffffff"/>
    <circle cx="26" cy="28" r="12" fill="#ecfdf5"/>
    <path d="M20 28 L24 32 L32 24" stroke="#059669" stroke-width="2" stroke-linecap="round"/>
    <text x="46" y="26" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#0f172a">Safe Permissions</text>
    <text x="46" y="38" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">Usage Stats Only</text>
    <line x1="16" y1="52" x2="154" y2="52" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="74" font-family="system-ui,sans-serif" font-size="9" fill="#0f766e">&#10003; Local-first processing</text>
    <text x="16" y="94" font-family="system-ui,sans-serif" font-size="9" fill="#0f766e">&#10003; No cloud keystroke logs</text>
    <text x="16" y="114" font-family="system-ui,sans-serif" font-size="9" fill="#0f766e">&#10003; No device-admin access</text>
    <text x="16" y="134" font-family="system-ui,sans-serif" font-size="9" fill="#059669" font-weight="bold">&#10003; Verified harmless</text>
  </g>

  <!-- Right: Bitwarden AES-256 Vault -->
  <g transform="translate(370, 100)" filter="url(#prv-shadow)">
    <rect width="170" height="150" rx="12" fill="#ffffff"/>
    <circle cx="26" cy="28" r="12" fill="#eff6ff"/>
    <path d="M26 18 L32 28 L20 28 Z" fill="#2563eb"/>
    <text x="46" y="26" font-family="system-ui,sans-serif" font-size="11" font-weight="bold" fill="#0f172a">AES-256 Vault</text>
    <text x="46" y="38" font-family="system-ui,sans-serif" font-size="8" fill="#64748b">Zero-Knowledge</text>
    <line x1="16" y1="52" x2="154" y2="52" stroke="#f1f5f9" stroke-width="1"/>
    <text x="16" y="74" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">&#10003; End-to-end encrypted</text>
    <text x="16" y="94" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">&#10003; Public audit verified</text>
    <text x="16" y="114" font-family="system-ui,sans-serif" font-size="9" fill="#1e40af">&#10003; Master key on-device</text>
    <text x="16" y="134" font-family="system-ui,sans-serif" font-size="9" fill="#2563eb" font-weight="bold">&#10003; 100% Free student tier</text>
  </g>
</svg>